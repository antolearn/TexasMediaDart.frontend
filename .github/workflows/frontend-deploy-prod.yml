name: Frontend Deploy - Prod

on:
  workflow_dispatch:
    inputs:
      frontend_version:
        description: 'Approved frontend version from DEV (example: 2026.09.08.0006)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy-prod:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest

    steps:
      - name: Display Production Frontend Version
        shell: bash
        run: |
          echo "Frontend version approved for PROD:"
          echo "${{ inputs.frontend_version }}"

          echo "### Production Frontend Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ inputs.frontend_version }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Download Approved Frontend Artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
        run: |
          ARTIFACT_NAME="TexasMediaDart.Frontend-${FRONTEND_VERSION}"

          echo "Looking for artifact:"
          echo "$ARTIFACT_NAME"

          ARTIFACT_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq ".artifacts
              | map(select(.name == \"$ARTIFACT_NAME\" and .expired == false))
              | sort_by(.created_at)
              | reverse
              | .[0].id")

          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "Artifact '$ARTIFACT_NAME' was not found or has expired."
            exit 1
          fi

          echo "Artifact found."
          echo "Artifact ID: $ARTIFACT_ID"

          mkdir -p artifacts

          gh api \
            "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > artifact.zip

          unzip -o artifact.zip -d artifacts

          echo "Artifact downloaded successfully."

      - name: Verify Approved Frontend Package
        shell: bash
        env:
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
        run: |
          PACKAGE="artifacts/TexasMediaDart.Frontend-${FRONTEND_VERSION}.zip"

          if [ ! -f "$PACKAGE" ]; then
            echo "Approved frontend package was not found:"
            echo "$PACKAGE"
            exit 1
          fi

          echo "Approved PROD frontend package:"
          echo "$PACKAGE"

      - name: Extract Approved Frontend Package
        shell: bash
        env:
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
        run: |
          mkdir -p deploy

          unzip \
            "artifacts/TexasMediaDart.Frontend-${FRONTEND_VERSION}.zip" \
            -d deploy

          echo "Frontend package extracted."

      - name: Create PROD runtime configuration
        shell: bash
        run: |
          cat > deploy/config.json <<'EOF'
          {
            "environment": "prod",
            "apiBaseUrl": "https://texasmediadart-api-prod-b7gwdke4b6a2bjdg.eastus-01.azurewebsites.net"
          }
          EOF

          echo "PROD runtime configuration:"
          cat deploy/config.json

      - name: Deploy to Azure Static Web Apps - Prod
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: deploy
          api_location: ""
          output_location: ""
          skip_app_build: true