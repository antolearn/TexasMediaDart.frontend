name: Frontend CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Flutter Build and Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        shell: bash
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No Flutter test directory found. Skipping Flutter tests."
          fi

      - name: Build Flutter Web
        run: flutter build web --release