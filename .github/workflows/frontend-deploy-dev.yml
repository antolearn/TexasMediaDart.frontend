name: Frontend Deploy - Dev

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release Frontend
    runs-on: ubuntu-latest

    outputs:
      build_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate build version
        id: version
        shell: bash
        run: |
          DATE=$(date +'%Y.%m.%d')
          BUILD=$(printf "%04d" "$GITHUB_RUN_NUMBER")
          VERSION="$DATE.$BUILD"

          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Frontend Release Version: $VERSION"

          echo "### Frontend Release Version" >> "$GITHUB_STEP_SUMMARY"
          echo "**$VERSION**" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Build Flutter Web for Dev
        run: >
          flutter build web --release
          --dart-define=ENVIRONMENT=dev
          --dart-define=FRONTEND_VERSION=${{ env.BUILD_VERSION }}
          --dart-define=API_BASE_URL=https://texasmediadart-api-dev-hde5d3asftb5ahe4.eastus-01.azurewebsites.net

      - name: Create versioned frontend package
        shell: bash
        run: |
          mkdir -p artifacts

          cd build/web

          zip -r \
            "${{ github.workspace }}/artifacts/TexasMediaDart.Frontend-${BUILD_VERSION}.zip" \
            .

          echo "Created frontend package:"
          echo "TexasMediaDart.Frontend-${BUILD_VERSION}.zip"

      - name: Upload versioned frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: TexasMediaDart.Frontend-${{ env.BUILD_VERSION }}
          path: artifacts/TexasMediaDart.Frontend-${{ env.BUILD_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

  deploy-dev:
    name: Deploy Frontend to Dev
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Display Frontend Version
        run: |
          echo "Deploying Frontend Version:"
          echo "${{ needs.build.outputs.build_version }}"

      - name: Download versioned frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: TexasMediaDart.Frontend-${{ needs.build.outputs.build_version }}
          path: artifacts

      - name: Extract frontend package
        shell: bash
        run: |
          mkdir -p deploy

          unzip \
            "artifacts/TexasMediaDart.Frontend-${{ needs.build.outputs.build_version }}.zip" \
            -d deploy

          echo "Frontend package extracted."

      - name: Deploy to Azure Static Web Apps - Dev
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_THANKFUL_SMOKE_0F354AB0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: deploy
          api_location: ""
          output_location: ""
          skip_app_build: true